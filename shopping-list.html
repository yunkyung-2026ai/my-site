<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 집 장보기</title>
<style>
  :root {
    --bg: #eef7ef;
    --card: #ffffff;
    --green: #2f8a4c;
    --green-dark: #1f6b38;
    --green-soft: #d7eedc;
    --text: #1f2d23;
    --muted: #7b8a7f;
    --line: #e2ece4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap; margin-bottom: 16px;
  }
  h1 { margin: 0; font-size: 1.6rem; color: var(--green-dark); }
  button {
    font: inherit; cursor: pointer; border: none; border-radius: 12px;
    padding: 10px 16px; font-weight: 600;
  }
  .btn-reset { background: var(--card); color: var(--green-dark); border: 2px solid var(--green-soft); }
  .btn-reset:hover { background: var(--green-soft); }
  .btn-add { background: var(--green); color: #fff; }
  .btn-add:hover { background: var(--green-dark); }

  .add {
    background: var(--card); border-radius: 18px; padding: 14px;
    box-shadow: 0 2px 10px rgba(31, 107, 56, .08);
    display: grid; grid-template-columns: 2fr 1fr 1.4fr auto; gap: 8px;
    margin-bottom: 20px;
  }
  .add input, .add select {
    font: inherit; padding: 10px 12px; border: 2px solid var(--line);
    border-radius: 12px; background: #fbfdfb; color: var(--text); min-width: 0;
  }
  .add input:focus, .add select:focus { outline: none; border-color: var(--green); }
  @media (max-width: 560px) {
    .add { grid-template-columns: 1fr 1fr; }
    .add .name { grid-column: 1 / -1; }
    .add .btn-add { grid-column: 1 / -1; }
  }

  .cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .cat {
    background: var(--card); border-radius: 18px; padding: 16px 16px 10px;
    box-shadow: 0 2px 10px rgba(31, 107, 56, .08);
  }
  .cat h2 {
    margin: 0 0 8px; font-size: 1.1rem; display: flex; justify-content: space-between; align-items: center;
  }
  .cat h2 .count { font-size: .85rem; font-weight: 500; color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { border-top: 1px solid var(--line); }
  li:first-child { border-top: none; }
  li label {
    display: flex; align-items: center; gap: 12px; padding: 10px 2px; cursor: pointer;
    transition: opacity .2s;
  }
  li input[type=checkbox] {
    appearance: none; width: 24px; height: 24px; flex: none; margin: 0;
    border: 2px solid #b9d6c0; border-radius: 8px; background: #fff; cursor: pointer;
    display: grid; place-content: center;
  }
  li input[type=checkbox]:checked { background: var(--green); border-color: var(--green); }
  li input[type=checkbox]:checked::after { content: "✓"; color: #fff; font-weight: 700; font-size: 15px; }
  .name-text { flex: 1; }
  .qty {
    font-size: .85rem; color: var(--green-dark); background: var(--green-soft);
    padding: 2px 10px; border-radius: 999px; white-space: nowrap;
  }
  li.done label { opacity: .45; }
  li.done .name-text { text-decoration: line-through; }
  .empty { color: var(--muted); font-size: .9rem; padding: 8px 2px 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🛒 우리 집 장보기</h1>
    <button class="btn-reset" id="reset">🔄 체크 모두 풀기</button>
  </header>

  <form class="add" id="addForm">
    <input class="name" id="newName" placeholder="살 것 (예: 양배추)" required>
    <input id="newQty" placeholder="수량 (예: 2개)">
    <select id="newCat"></select>
    <button class="btn-add" type="submit">추가</button>
  </form>

  <div class="cats" id="cats"></div>
</div>

<script>
  const KEY = "our-home-shopping-list-v1";
  const CATS = [
    { id: "veg",   name: "🥬 채소·과일" },
    { id: "meat",  name: "🥩 고기·생선" },
    { id: "dairy", name: "🥛 유제품·달걀" },
    { id: "grain", name: "🍚 곡물·가공식품" },
    { id: "life",  name: "🧴 생활용품" },
  ];
  const DEFAULTS = [
    ["veg", "양파"], ["veg", "대파"], ["veg", "사과"],
    ["meat", "돼지고기"], ["meat", "고등어"],
    ["dairy", "우유"], ["dairy", "달걀"],
    ["grain", "쌀"], ["grain", "두부"], ["grain", "라면"],
    ["life", "휴지"], ["life", "주방세제"],
  ];

  let items = load();

  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(KEY));
      if (Array.isArray(saved)) return saved;
    } catch (e) {}
    return DEFAULTS.map(([cat, name], i) => ({ id: "d" + i, cat, name, qty: "", done: false }));
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {}
  }

  function render() {
    const box = document.getElementById("cats");
    box.innerHTML = "";
    for (const cat of CATS) {
      const list = items.filter(it => it.cat === cat.id);
      // 안 산 것은 위로, 체크한 것은 아래로 (각 그룹 안에서는 추가한 순서 유지)
      list.sort((a, b) => a.done - b.done);
      const left = list.filter(it => !it.done).length;

      const card = document.createElement("section");
      card.className = "cat";
      const h2 = document.createElement("h2");
      h2.textContent = cat.name;
      const count = document.createElement("span");
      count.className = "count";
      count.textContent = list.length ? `남은 것 ${left}/${list.length}` : "";
      h2.appendChild(count);
      card.appendChild(h2);

      const ul = document.createElement("ul");
      if (!list.length) {
        const p = document.createElement("div");
        p.className = "empty";
        p.textContent = "아직 항목이 없어요";
        card.appendChild(p);
      }
      for (const it of list) {
        const li = document.createElement("li");
        if (it.done) li.className = "done";
        const label = document.createElement("label");
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = it.done;
        cb.addEventListener("change", () => { it.done = cb.checked; save(); render(); });
        const name = document.createElement("span");
        name.className = "name-text";
        name.textContent = it.name;
        label.append(cb, name);
        if (it.qty) {
          const q = document.createElement("span");
          q.className = "qty";
          q.textContent = it.qty;
          label.appendChild(q);
        }
        li.appendChild(label);
        ul.appendChild(li);
      }
      card.appendChild(ul);
      box.appendChild(card);
    }
  }

  const sel = document.getElementById("newCat");
  for (const cat of CATS) {
    const o = document.createElement("option");
    o.value = cat.id;
    o.textContent = cat.name;
    sel.appendChild(o);
  }

  document.getElementById("addForm").addEventListener("submit", e => {
    e.preventDefault();
    const nameEl = document.getElementById("newName");
    const qtyEl = document.getElementById("newQty");
    const name = nameEl.value.trim();
    if (!name) return;
    items.push({ id: "n" + Date.now(), cat: sel.value, name, qty: qtyEl.value.trim(), done: false });
    save();
    render();
    nameEl.value = "";
    qtyEl.value = "";
    nameEl.focus();
  });

  document.getElementById("reset").addEventListener("click", () => {
    if (!items.some(it => it.done)) return;
    if (!confirm("체크한 것을 모두 풀까요?")) return;
    items.forEach(it => it.done = false);
    save();
    render();
  });

  render();
</script>
</body>
</html>
